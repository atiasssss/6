<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico Smart TV</title><style>body{background:#102443;color:white;font:22px Arial;padding:24px}h1,h2{color:#65d5ff}pre{white-space:pre-wrap;word-wrap:break-word;background:#203b60;padding:18px}button{font-size:24px;padding:12px}</style><h1>Diagnóstico de interfaces Smart TV</h1><p>Inspección de presencia de interfaces, sin ejecutar funciones del fabricante.</p><button onclick="run()">Repetir diagnóstico</button><pre id="out">Iniciando...</pre><script>
function run(){var lines=[];function add(s){lines.push(s);}function check(obj,n){try{var d=Object.getOwnPropertyDescriptor(obj,n);if(d){return d.get||d.set?'Presente (accesor no invocado)':'Presente ('+typeof d.value+')';}return n in obj?'Presente (heredado)':'No detectado';}catch(e){return 'No comprobable';}}add('Navegador: '+navigator.userAgent);add('Plataforma: '+navigator.platform);add('\n1. Interfaces conocidas');var names=['oipfObjectFactory','oipf','HbbTV','hbbtv','tizen','webapis','webOS','PalmSystem','NetCast','netready','Netready','SRAF','sraf','Android','external','opera','cefQuery','webkit','MediaSource','WebSocket'];for(var i=0;i<names.length;i++){add(names[i]+': '+check(window,names[i]));}add('\n2. Nombres globales potencialmente relacionados con TV');try{var keys=Object.getOwnPropertyNames(window).sort();var hits=[];for(var j=0;j<keys.length;j++){if(/tv|oipf|hbb|sraf|netready|device|media|storage|usb|native|vendor|platform|player|broadcast|application|bridge|system/i.test(keys[j])){hits.push(keys[j]+': '+check(window,keys[j]));}}add(hits.join('\n')||'Ninguno');}catch(e){add('No comprobable');}add('\n3. Interfaces de almacenamiento');var ns=['usb','storage','webkitTemporaryStorage','webkitPersistentStorage','getDeviceStorage'];for(var k=0;k<ns.length;k++){add('navigator.'+ns[k]+': '+check(navigator,ns[k]));}add('webkitRequestFileSystem: '+check(window,'webkitRequestFileSystem'));add('\nLa presencia de una interfaz no demuestra permisos ni funcionamiento. No se han llamado funciones nativas ni accedido al USB.');document.getElementById('out').textContent=lines.join('\n');}run();</script></html>
